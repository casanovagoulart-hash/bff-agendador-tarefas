# =====================================================================
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO (BFF)
# O BFF não utiliza banco de dados próprio (é um orquestrador stateless).
# =====================================================================

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Nome da aplicação nos logs do Spring Boot
spring.application.name=bff-agendador-tarefas

# Porta em que este microsserviço BFF será executado (Container Mapeado: 8084)
server.port=8084

# =====================================================================
# URLS DE COMUNICAÇÃO (INTEGRAÇÃO DOCKER CONTAINER -> HOST WINDOWS)
# O host 'host.docker.internal' é o DNS que o Docker usa para alcançar o Windows.
# =====================================================================
# URL de comunicação com o microsserviço Core de Usuários
usuario.url=http://host.docker.internal:8080

# URL de comunicação com o microsserviço Core de Tarefas
agendador-tarefas.url=http://host.docker.internal:8081

# URL de comunicação com o microsserviço Core de Notificação
notificacao.url=http://host.docker.internal:8082

feign.httpclient.enabled=true

# CRON para execução de tarefas agendadas (a cada 5 minutos)
cron.horario=0 0/5 * * * ?

usuario.email=admin@admin.com
usuario.senha=123456

# =====================================================================
# SEGURANÇA E AUTENTICAÇÃO (JWT & SPRING SECURITY)
# =====================================================================

# O padrão RFC 7518 e bibliotecas modernas de JWT (como a JJWT no Java/Spring)
# exigem que a chave secreta tenha no mínimo 512 bits (64 bytes)
# de tamanho para garantir a segurança criptográfica do HMAC-SHA512.
# Com fallback seguro para desenvolvimento local caso a variável não esteja setada
jwt.secret=${JWT_SECRET:89a7f5d96b3a2e1c4d7e8f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c}

# Credenciais de acesso HTTP Basic Auth para visualizar o Swagger UI
# Injetadas via variáveis de ambiente no container (-e SWAGGER_USER e -e SWAGGER_PASSWORD)
spring.security.user.name=${SWAGGER_USER}
spring.security.user.password={noop}${SWAGGER_PASSWORD}

# =====================================================================
# DOCUMENTAÇÃO DA API (SWAGGER / OPENAPI)
# =====================================================================

# Mantém a documentação ativa de forma controlada
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# =====================================================================
# TELEMETRIA & DEBUGS
# =====================================================================

# Rastreamento detalhado de requisições web, mapeamento e rotas
logging.level.org.springframework.web=DEBUG

# Rastreamento detalhado de segurança, tokens e permissões
logging.level.org.springframework.security=DEBUG
