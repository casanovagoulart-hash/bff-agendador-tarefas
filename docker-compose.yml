services:
  db:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_DB: db_usuario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_usuario"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:latest
    container_name: mongo-db
    ports:
      - "27017:27017"

  usuario:
    build: ../usuariogradlegroovy
    container_name: usuario-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/db_usuario
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  notificacao:
    build: ../notificacao
    container_name: notificacao-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: ${MONGO_URI}
    depends_on:
      - mongo

  agendadortarefas:
    build: ../agendadortarefas
    container_name: agendador-service
    ports:
      - "8081:8081"
    depends_on:
      - db

  bff:
    build: .
    container_name: bff-service
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - usuario
      - agendadortarefas
