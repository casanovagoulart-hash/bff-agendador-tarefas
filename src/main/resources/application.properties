# =====================================================================
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO (BFF)
# =====================================================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

spring.application.name=bff-agendador-tarefas

# CORREÇÃO: Alinhado para a porta 8083 para bater exatamente com o Dockerfile e o docker-compose.yml
server.port=8083

# =====================================================================
# URLS DE COMUNICAÇÃO (DINÂMICAS PARA LOCAL E DOCKER)
# ARGUMENTO DIDÁTICO: Usar variáveis com valor padrão (${VAR:default}) permite que o mesmo
# código rode tanto localmente na sua máquina (localhost) quanto dentro da rede Docker
# (usando os nomes dos serviços definidos no docker-compose.yml).
# =====================================================================
usuario.url=${USUARIO_URL:http://localhost:8080}
agendador-tarefas.url=${AGENDADOR_TAREFAS_URL:http://localhost:8081}
notificacao.url=${NOTIFICACAO_URL:http://localhost:8082}

feign.httpclient.enabled=true

# CRON para execução a cada 5 minutos
cron.horario=0 0/5 * * * ?

usuario.email=${USUARIO_CRON_EMAIL:admin@admin.com}
usuario.senha=${USUARIO_CRON_SENHA:123456}

# =====================================================================
# SEGURANÇA E AUTENTICAÇÃO (JWT)
# =====================================================================
jwt.secret=${JWT_SECRET}

# =====================================================================
# DOCUMENTAÇÃO DA API (SWAGGER / OPENAPI)
# =====================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# =====================================================================
# TELEMETRIA & DEBUGS
# =====================================================================
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
