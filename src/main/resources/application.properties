# =====================================================================
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO (BFF)
# =====================================================================

# Nome da aplicação que aparece nos logs do Spring Boot
spring.application.name=bff-agendador-tarefas

# =====================================================================
# URLS DE COMUNICAÇÃO (APONTADAS PARA A PORTA DO CORE: 8081)
# =====================================================================
# URL de comunicação com o microsserviço Core de Usuários
usuario.url=http://localhost:8080

# URL de comunicação com o microsserviço Core de Tarefas
agendador-tarefas.url=http://localhost:8081
notificacao.url=http://localhost:8082

# Porta em que este microsserviço BFF será executado localmente
server.port=8083

feign.httpclient.enabled=true

# CRON aplicação de schedule de notificaçõ de horário.
cron.horario=0 0/5 * * * ?

usuario.email=admin@admin.com
usuario.senha=123456

# =====================================================================
# SEGURANÇA E AUTENTICAÇÃO (JWT & SPRING SECURITY)
# =====================================================================

# Chave secreta JWT (Padrão RFC 7518 - Mínimo de 64 bytes / 512 bits)
# Com fallback seguro para desenvolvimento local se a variável não estiver setada
jwt.secret=${JWT_SECRET:89a7f5d96b3a2e1c4d7e8f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c}

# Credenciais de acesso protegidas por HTTP Basic Auth para visualizar o Swagger
# O prefixo {noop} informa ao Spring Security que a senha está em texto plano (sem hash)
# Se a variável de ambiente não existir, a aplicação assume um valor vazio ou nulo em vez de expor uma senha real fraca.
spring.security.user.name=${SWAGGER_USER:}
spring.security.user.password={noop}${SWAGGER_PASSWORD:}

# =====================================================================
# DOCUMENTAÇÃO DA API (SWAGGER / OPENAPI)
# =====================================================================

# Mantém a documentação ativa de forma controlada (protegida por senha no SecurityConfig)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# =====================================================================
# TELEMETRIA & DEBUGS
# =====================================================================

# Rastreamento detalhado de requisições web, mapeamento e rotas.
logging.level.org.springframework.web=DEBUG

# Rastreamento implacável de cada filtro de segurança, tokens e permissões.
logging.level.org.springframework.security=DEBUG
